[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invocation-protocol"
version = "0.3.1"
description = "Reusable LLM Ceremonial Invocation Protocol and 4-arm evaluation harness (stdlib-only Python)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/OmnisMutus/ceremonial-invocation-protocol"
Repository = "https://github.com/OmnisMutus/ceremonial-invocation-protocol"
Issues = "https://github.com/OmnisMutus/ceremonial-invocation-protocol/issues"

[project.scripts]
invocation-protocol = "invocation_protocol.cli:main"

[tool.setuptools]
# The repo's top-level forms/ and tasks/ are shipped inside the wheel as data-only
# subpackages, so an installed package works outside a checkout without keeping a second
# copy of the files in the repo. See invocation_protocol.forms.resolve_data_paths().
packages = ["invocation_protocol", "invocation_protocol.data_forms", "invocation_protocol.data_tasks"]

[tool.setuptools.package-dir]
"invocation_protocol.data_forms" = "forms"
"invocation_protocol.data_tasks" = "tasks"

[tool.setuptools.package-data]
invocation_protocol = ["viewer_template.html", "studio_template.html"]
"invocation_protocol.data_forms" = ["*.json"]
"invocation_protocol.data_tasks" = ["*.json"]
