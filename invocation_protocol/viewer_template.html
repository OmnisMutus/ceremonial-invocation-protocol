<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liber E Viewer</title>
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f0f1f4;
  --ink: #16181d;
  --ink-2: #474c57;
  --ink-3: #737885;
  --line: #dde0e6;
  --line-2: #c6cad3;
  --accent: #2d5bd7;
  --accent-soft: #e5ecfc;
  --pass: #1c7a4f;
  --pass-soft: #def1e6;
  --fail: #b8402b;
  --fail-soft: #f8e2dc;
  --warn: #8a6100;
  --warn-soft: #f6ecd2;
  --r: 3px;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #181b21; --panel-2: #1f232b; --ink: #e8eaee; --ink-2: #b4b8c2; --ink-3: #868b96;
    --line: #2a2f39; --line-2: #3a404c; --accent: #7fa2ff; --accent-soft: #1d2740;
    --pass: #58c48f; --pass-soft: #16301f; --fail: #f2876f; --fail-soft: #391f19; --warn: #e2b75c; --warn-soft: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #181b21; --panel-2: #1f232b; --ink: #e8eaee; --ink-2: #b4b8c2; --ink-3: #868b96;
  --line: #2a2f39; --line-2: #3a404c; --accent: #7fa2ff; --accent-soft: #1d2740;
  --pass: #58c48f; --pass-soft: #16301f; --fail: #f2876f; --fail-soft: #391f19; --warn: #e2b75c; --warn-soft: #33290f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-3); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* Header */
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.bar1 { display: flex; align-items: center; gap: 14px; min-height: 50px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.crumbs { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; flex-wrap: wrap; }
.crumbs .logo { font-weight: 700; letter-spacing: .02em; display: inline-flex; align-items: center; gap: 7px; }
.crumbs .logo svg { width: 16px; height: 16px; }
.crumbs .sep { color: var(--line-2); }
.crumbs .cur { color: var(--ink-2); font-family: var(--mono); font-size: 12.5px; }
.ctl { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); height: 30px; padding: 0 10px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.ctl:hover { color: var(--ink); border-color: var(--line-2); }
select.ctl { padding-right: 6px; }
.nav { display: flex; gap: 0; overflow-x: auto; }
.nav button { border: 0; background: none; cursor: pointer; padding: 9px 14px 8px; color: var(--ink-3); border-bottom: 2px solid transparent; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding: 18px 0 48px; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin: 0 0 16px; }
.phead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.phead h2 { margin: 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; }
.phead p { margin: 0; color: var(--ink-3); font-size: 12px; }
.scroll-x { overflow-x: auto; }

/* Integrity */
.integrity { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; padding: 12px 16px; font-size: 12.5px; color: var(--ink-2); }
.kv { display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.kv .k { color: var(--ink-3); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: var(--r); font-weight: 600; font-size: 11.5px; letter-spacing: .02em; border: 1px solid transparent; }
.tag.ok { background: var(--pass-soft); color: var(--pass); border-color: color-mix(in srgb, var(--pass) 30%, transparent); }
.tag.bad { background: var(--fail-soft); color: var(--fail); border-color: color-mix(in srgb, var(--fail) 30%, transparent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.tag.info { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.tag.neutral { background: var(--panel-2); color: var(--ink-2); border-color: var(--line); }
.hash { font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 0 6px; cursor: pointer; }
.hash:hover { border-color: var(--line-2); }

.notice { display: grid; grid-template-columns: 4px 1fr; margin: 0 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 12.5px; }
.notice::before { content: ""; background: var(--warn); }
.notice.bad::before { background: var(--fail); }
.notice > div { padding: 10px 14px; }
.notice b { color: var(--ink); }
.notice ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.kpi { padding: 12px 16px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; }
.kpi .value { font-size: 24px; font-weight: 600; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.kpi .sub { color: var(--ink-3); font-size: 11.5px; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
thead th { font-weight: 600; color: var(--ink-3); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; background: var(--panel-2); border-top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
tr.sub td:first-child { padding-left: 30px; color: var(--ink-2); }
.armname { font-weight: 600; }
.armtag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 6px; }
.meter { display: inline-flex; align-items: center; gap: 8px; min-width: 140px; }
.meter .track { flex: 1; height: 4px; background: var(--panel-2); min-width: 70px; border-radius: 1px; overflow: hidden; }
.meter .fill { display: block; height: 100%; background: var(--pass); }
.meter > span:last-child { font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; color: var(--ink-2); font-size: 12px; }
.zero { color: var(--ink-3); }
.hot { color: var(--fail); font-weight: 600; }
.delta-up { color: var(--pass); font-weight: 600; }
.delta-down { color: var(--fail); font-weight: 600; }

/* Matrix */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 4px 11px; cursor: pointer; color: var(--ink-2); font-size: 12px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 4px 10px; height: 30px; min-width: 240px; flex: 1; max-width: 380px; }
.legend { display: inline-flex; gap: 12px; color: var(--ink-3); font-size: 11.5px; margin-left: auto; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }
.matrix td { padding: 4px 6px; }
.matrix thead th { padding: 8px 6px; }
.matrix th.task { text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 11px; }
.matrix td.rowlabel { padding-left: 16px; min-width: 200px; }
.cell { width: 100%; min-width: 128px; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 6px; border: 1px solid transparent; border-left-width: 3px; border-radius: var(--r); padding: 6px 8px; cursor: pointer; text-align: left; font-size: 12px; background: var(--panel-2); }
.cell:hover { border-color: var(--line-2); }
.cell.pass { border-left-color: var(--pass); background: var(--pass-soft); }
.cell.fail { border-left-color: var(--fail); background: var(--fail-soft); }
.cell.mixed { border-left-color: var(--warn); background: var(--warn-soft); }
.cell.dim { opacity: .25; }
.cell.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.cell .glyph { font-weight: 700; text-align: center; }
.cell.pass .glyph { color: var(--pass); }
.cell.fail .glyph { color: var(--fail); }
.cell.mixed .glyph { color: var(--warn); }
.cell .gates { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.empty { padding: 6px 8px; color: var(--ink-3); }

/* Compare */
.cmpbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cmpbar label { display: inline-flex; gap: 6px; align-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; }
.chip { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; min-width: 110px; }
.chip .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.up .v { color: var(--pass); }
.chip.down .v { color: var(--fail); }
.dcell { width: 100%; min-width: 128px; display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; cursor: pointer; background: var(--panel); font-size: 12px; text-align: left; }
.dcell:hover { border-color: var(--line-2); }
.dcell.up { border-left: 3px solid var(--pass); background: var(--pass-soft); }
.dcell.down { border-left: 3px solid var(--fail); background: var(--fail-soft); }
.dcell .ab { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

/* Gates */
.heat td.cnt { text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; }
.heat .h { display: inline-block; min-width: 42px; padding: 2px 6px; border-radius: var(--r); }
.reasons-list { list-style: none; margin: 0; padding: 0; }
.reasons-list li { display: grid; grid-template-columns: 46px 110px 1fr; gap: 10px; align-items: baseline; padding: 7px 16px; border-top: 1px solid var(--line); }
.reasons-list li:first-child { border-top: 0; }
.reasons-list .c { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.reasons-list button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); }
.reasons-list button:hover { color: var(--accent); text-decoration: underline; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .38); opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s cubic-bezier(.2,.7,.2,1); z-index: 50; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.dhead { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dhead .t { flex: 1; min-width: 0; }
.dhead h3 { margin: 4px 0 0; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dbody { overflow-y: auto; padding: 4px 18px 32px; flex: 1; }
.dbody h4 { margin: 18px 0 8px; }
.lineage { display: flex; align-items: stretch; overflow-x: auto; padding: 14px 0 4px; }
.node { flex: 0 0 auto; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; background: var(--panel-2); min-width: 92px; }
.node .s { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.node .l { font-size: 12px; font-weight: 600; white-space: nowrap; }
.node.pass { border-color: var(--pass); background: var(--pass-soft); }
.node.fail { border-color: var(--fail); background: var(--fail-soft); }
.node.missing { opacity: .45; border-style: dashed; }
.link { flex: 0 0 18px; align-self: center; height: 1px; background: var(--line-2); position: relative; }
.link::after { content: ""; position: absolute; right: 0; top: -3px; border: 3.5px solid transparent; border-left-color: var(--line-2); border-right: 0; }
.siblings { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.gate { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: start; }
.gate:first-child { border-top: 0; }
.gate .ic { font-weight: 700; text-align: center; }
.gate.pass .ic, .gate.pass .st { color: var(--pass); }
.gate.fail .ic, .gate.fail .st { color: var(--fail); }
.gate .name { font-family: var(--mono); font-size: 12px; }
.gate .st { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.gate .reasons { grid-column: 2 / 4; color: var(--ink-2); font-size: 12px; margin: 0; padding-left: 16px; }
.answer { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; background: var(--panel-2); }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-top: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 12px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
pre.code { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 12px 0 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 460px; overflow: auto; color: var(--ink); }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px; margin: 12px 0 0; font-size: 12.5px; }
dl.facts dt { color: var(--ink-3); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.navbtns { display: flex; gap: 6px; }

.drop { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 16%, transparent); border: 2px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--ink); }
.drop.on { display: flex; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 70; }
.toast.on { opacity: 1; }
footer { color: var(--ink-3); font-size: 11.5px; padding: 6px 0; }
.onboard { text-align: center; padding: 80px 20px; color: var(--ink-2); }

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-left: 0; }
  .kpi { border-top: 1px solid var(--line); }
  .legend { margin-left: 0; }
  .reasons-list li { grid-template-columns: 30px 64px 1fr; gap: 8px; padding-left: 12px; padding-right: 12px; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  header.top { position: static; }
  input[type=search] { min-width: 0; width: 100%; max-width: none; }
  .dhead, .dbody { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar1">
    <nav class="crumbs" aria-label="Breadcrumb">
      <span class="logo"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 5h7M4.5 8h7M4.5 11h4" stroke="currentColor" stroke-width="1.5"/></svg>Liber E</span>
      <span class="sep">/</span><span class="muted">Ledgers</span>
      <span class="sep">/</span><span class="cur" id="crumbLedger">—</span>
    </nav>
    <select class="ctl" id="ledgerSelect" aria-label="Ledger"></select>
    <button class="ctl" id="openFile" title="Open a traces.jsonl file (unverified)">Open file…</button>
    <button class="ctl" id="themeBtn" aria-label="Toggle color theme" title="Toggle theme">◐</button>
    <input type="file" id="fileInput" accept=".jsonl,.json,application/json" multiple hidden>
  </div>
  <div class="wrap nav" id="nav" role="tablist" aria-label="Views"></div>
</header>

<main class="wrap" id="app"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dhead">
    <div class="t"><div class="eyebrow" id="drawerCrumb"></div><h3 id="drawerTitle"></h3></div>
    <div class="navbtns">
      <button class="ctl" id="prevBtn" aria-label="Previous run" title="Previous run (←)">←</button>
      <button class="ctl" id="nextBtn" aria-label="Next run" title="Next run (→)">→</button>
      <button class="ctl" id="closeBtn" aria-label="Close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div class="dbody" id="drawerBody"></div>
</aside>
<div class="drop" id="drop">Drop traces.jsonl to view (unverified)</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const DATA = /*__LEDGER_DATA__*/[];

const ARM_ORDER = ["arm_0_baseline", "arm_1_naive_summoning", "arm_2_protocol_neutral", "arm_3_protocol_form", "arm_3b_corrupted_correspondence"];
const ARM_LABEL = {
  arm_0_baseline: "Arm 0 · Baseline",
  arm_1_naive_summoning: "Arm 1 · Naive summoning",
  arm_2_protocol_neutral: "Arm 2 · Protocol, neutral",
  arm_3_protocol_form: "Arm 3 · Protocol, deity form",
  arm_3b_corrupted_correspondence: "Arm 3b · Form-integrity check",
};
const STAGES = ["banish", "open_hierarchy", "assume_form", "run_charge", "test_spirit", "depart", "record"];
const GATE_ORDER = ["schema_gate", "epistemic_gate", "quote_gate", "tool_claim_gate", "slip_gate", "correspondence_gate", "blind_second_pass"];
const GATE_SHORT = { schema_gate: "schema", epistemic_gate: "epistemic", quote_gate: "quote", tool_claim_gate: "tool", slip_gate: "slip", correspondence_gate: "corr", blind_second_pass: "blind" };

const state = { ledger: 0, view: "overview", filter: "all", q: "", open: null, tab: "output", cmpA: 0, cmpB: 1, cmpAll: false };

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const armLabel = (a) => ARM_LABEL[a] || a;
function gateStatus(e, name) { for (const g of e.gates || []) if (g.gate_name === name) return g.status; return ""; }
const failedGates = (e) => (e.gates || []).filter((g) => g.status !== "PASS").map((g) => g.gate_name);
const passed = (e) => e.verdict === "PASSED";
function stats(entries) {
  const n = entries.length;
  return {
    n,
    passed: entries.filter(passed).length,
    honest: entries.filter((e) => ["epistemic_gate", "quote_gate", "tool_claim_gate"].every((g) => gateStatus(e, g) === "PASS")).length,
    slips: entries.filter((e) => gateStatus(e, "slip_gate") !== "PASS").length,

const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
let lastFocus = null;
function ledgerOf(e) { return DATA.find((L) => L.entries.includes(e)); }
function openDrawer(e) {
  if (!e) return;
  if (!drawer.classList.contains("open")) lastFocus = document.activeElement;
  state.open = e;
  drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  renderDrawer(); renderMain();
  document.getElementById("closeBtn").focus();
}
function closeDrawer(silent) {
  if (!drawer.classList.contains("open")) return;
  state.open = null;
  drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
  if (!silent) { renderMain(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
}
function step(delta) {
  const L = ledgerOf(state.open); if (!L) return;
  const list = orderedRuns(L);
  const i = list.indexOf(state.open);
  if (i >= 0) openDrawer(list[(i + delta + list.length) % list.length]);
}
function lineage(e) {
  const done = new Set(e.lifecycle_stages || []);
  const ok = passed(e);
  const fails = failedGates(e);
  const detail = {
    banish: "fresh context",
    open_hierarchy: e.arm === "arm_0_baseline" || e.arm === "arm_1_naive_summoning" ? "no stack" : "authority stack",
    assume_form: e.form_id || "no form",
    run_charge: `${(e.tool_log || []).length} tool call(s)`,
    test_spirit: e.gates && e.gates.length ? (ok ? `${e.gates.length} gates pass` : `${fails.length} gate(s) fail`) : "not reached",
    depart: (e.departure || {}).clean === false ? "NOT clean" : `${(e.departure || {}).persisted_persona_bytes ?? 0} B residual`,
    record: short(e.entry_hash).slice(0, 10),
  };
  const nodes = [];
  STAGES.forEach((s, i) => {
    if (i) nodes.push(h("span", { class: "link", "aria-hidden": "true" }));
    const cls = !done.has(s) ? "missing" : s === "test_spirit" ? (ok ? "pass" : "fail") : s === "depart" && (e.departure || {}).clean === false ? "fail" : "";
    nodes.push(h("div", { class: `node ${cls}`, title: s }, h("div", { class: "s" }, `${i + 1} · ${s}`), h("div", { class: "l" }, detail[s])));
  });
  return h("div", { class: "lineage", role: "list", "aria-label": "Lifecycle" }, nodes);
}
function renderDrawer() {
  const e = state.open; if (!e) return;
  const ok = passed(e);
  const L = ledgerOf(e);
  document.getElementById("drawerCrumb").textContent = `${L ? L.label : ""} / ${armLabel(e.arm)} / ${e.form_id || "no form"}`;
  document.getElementById("drawerTitle").replaceChildren(h("span", { class: `tag ${ok ? "ok" : "bad"}` }, ok ? "✓ PASSED" : "✕ BANISHED"), h("span", null, e.task_id), h("span", { class: "muted", style: "font-size:12.5px;font-weight:400" }, e.task_category || ""));

  const siblings = L ? L.entries.filter((x) => rowKey(x) === rowKey(e) && x.task_id === e.task_id) : [e];
  const parsed = e.accepted_output || parseJSON(e.raw_output || "");
  const answer = parsed && typeof parsed.answer === "string" ? parsed.answer : null;
  const gateList = (e.gates || []).slice().sort((a, b) => GATE_ORDER.indexOf(a.gate_name) - GATE_ORDER.indexOf(b.gate_name)).map((g) => {
    const pass = g.status === "PASS";
    return h("div", { class: `gate ${pass ? "pass" : "fail"}` },
      h("span", { class: "ic", "aria-hidden": "true" }, pass ? "✓" : "✕"), h("span", { class: "name" }, g.gate_name), h("span", { class: "st" }, g.status),
      g.reasons && g.reasons.length ? h("ul", { class: "reasons" }, g.reasons.map((r) => h("li", null, r))) : null);
  });
  const tabs = [["output", "Raw output"], ["thinking", `Reasoning${e.thinking_chars ? ` (${Number(e.thinking_chars).toLocaleString()})` : ""}`], ["tools", `Tool log (${(e.tool_log || []).length})`], ["audit", "Audit"], ["json", "Record JSON"]];
  let tabPanel;
  if (state.tab === "output") { const p = parseJSON(e.raw_output || ""); tabPanel = h("pre", { class: "code" }, p ? JSON.stringify(p, null, 2) : (e.raw_output || "(empty output)")); }
  else if (state.tab === "thinking") tabPanel = h("pre", { class: "code" }, e.thinking_output || "(no reasoning trace recorded)");
  else if (state.tab === "tools") tabPanel = (e.tool_log || []).length
    ? h("div", null, e.tool_log.map((t, i) => h("dl", { class: "facts" },
        h("dt", null, `#${i + 1} tool`), h("dd", { class: "mono" }, t.tool_name),
        h("dt", null, "status"), h("dd", null, h("span", { class: `tag ${t.allowed ? "ok" : "bad"}` }, t.allowed ? "ALLOWED" : "DENIED")),
        h("dt", null, "args"), h("dd", { class: "mono" }, JSON.stringify(t.args)),
        h("dt", null, t.allowed ? "output" : "error"), h("dd", { class: "mono" }, t.allowed ? String(t.output) : String(t.error)))))
    : h("p", { class: "muted" }, "No tool calls in this run.");
  else if (state.tab === "audit") { const d = e.departure || {}, c = e.config || {};
    tabPanel = h("dl", { class: "facts" },
      h("dt", null, "trace_id"), h("dd", { class: "mono" }, e.trace_id),
      h("dt", null, "recorded"), h("dd", null, e.recorded_at || "—"),
      h("dt", null, "protocol"), h("dd", { class: "mono" }, e.protocol_version || "pre-1.2"),
      h("dt", null, "backend"), h("dd", { class: "mono" }, e.backend),
      h("dt", null, "departure"), h("dd", null, `${d.clean ? "clean" : "NOT clean"} · ${d.persisted_persona_bytes ?? "?"} residual bytes · ${d.cleared_messages ?? "?"} messages cleared`),
      h("dt", null, "config"), h("dd", { class: "mono" }, `temp=${c.temperature} seed=${c.seed} max_tokens=${c.max_tokens} turns=${c.max_turns} tools=${c.max_tool_calls}`),
      e.runtime_error ? h("dt", null, "runtime error") : null, e.runtime_error ? h("dd", { class: "mono", style: "color:var(--fail)" }, e.runtime_error) : null,
      h("dt", null, "prev_hash"), h("dd", null, h("button", { class: "hash", onclick: () => copy(e.prev_hash) }, short(e.prev_hash))),
      h("dt", null, "entry_hash"), h("dd", null, h("button", { class: "hash", onclick: () => copy(e.entry_hash) }, short(e.entry_hash)))); }
  else tabPanel = h("pre", { class: "code" }, JSON.stringify(e, null, 2));

  document.getElementById("drawerBody").replaceChildren(...[
    lineage(e),
    siblings.length > 1 ? h("div", { class: "siblings" }, h("span", { class: "eyebrow", style: "align-self:center" }, `Runs (${siblings.filter(passed).length}/${siblings.length} passed)`),
      siblings.map((s, i) => h("button", { class: `tag ${passed(s) ? "ok" : "bad"}`, style: s === e ? "outline: 2px solid var(--accent)" : "cursor:pointer", onclick: () => openDrawer(s) }, `#${i + 1}`))) : null,
    h("h4", { class: "eyebrow" }, "Answer"),
    answer !== null ? h("div", { class: "answer" }, answer, h("div", { class: "eyebrow", style: "margin-top:6px" }, e.accepted_output ? "accepted" : "not accepted"))
      : h("div", { class: "answer muted" }, "Output was not schema-valid JSON."),
    h("h4", { class: "eyebrow" }, "Gates"),
    h("div", null, gateList.length ? gateList : h("p", { class: "muted" }, "No gate results (run failed before test_spirit).")),
    h("div", { class: "tabs", role: "tablist" }, tabs.map(([id, label]) => h("button", { role: "tab", "aria-selected": String(state.tab === id), onclick: () => { state.tab = id; renderDrawer(); } }, label))),
    h("div", { role: "tabpanel" }, tabPanel)].filter(Boolean));
}
document.getElementById("closeBtn").addEventListener("click", () => closeDrawer());
document.getElementById("prevBtn").addEventListener("click", () => step(-1));
document.getElementById("nextBtn").addEventListener("click", () => step(1));
scrim.addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (ev) => {
  if (!state.open) return;
  if (ev.key === "Escape") closeDrawer();
  else if (ev.key === "ArrowRight" && ev.target.tagName !== "INPUT") step(1);
  else if (ev.key === "ArrowLeft" && ev.target.tagName !== "INPUT") step(-1);
});

/* ---------- open / drop unverified files ---------- */
function loadFiles(files) {
  [...files].forEach((f) => f.text().then((txt) => {
    const entries = [];
    for (const line of txt.split(/\r?\n/)) { if (!line.trim()) continue; const v = parseJSON(line); if (v) entries.push(v); }
    if (!entries.length) { toast(`${f.name}: no trace records`); return; }
    DATA.push({ label: f.name.replace(/\.jsonl?$/, ""), path: f.name, verified: null, errors: [], head: entries.at(-1).entry_hash || null, entries });
    state.ledger = DATA.length - 1; closeDrawer(true); render();
  }));
}
const fileInput = document.getElementById("fileInput");
document.getElementById("openFile").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { loadFiles(fileInput.files); fileInput.value = ""; });
const drop = document.getElementById("drop");
let dragDepth = 0;
addEventListener("dragenter", (ev) => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes("Files")) { dragDepth++; drop.classList.add("on"); } });
addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove("on"); });
addEventListener("dragover", (ev) => ev.preventDefault());
addEventListener("drop", (ev) => { ev.preventDefault(); dragDepth = 0; drop.classList.remove("on"); if (ev.dataTransfer) loadFiles(ev.dataTransfer.files); });

// Default comparison: the newest ledger (B) against the next newest (A), by last recorded_at.
if (DATA.length > 1) {
  const lastAt = (L) => L.entries.map((e) => e.recorded_at || "").sort().at(-1) || "";
  const byAge = DATA.map((L, i) => [lastAt(L), i]).sort((x, y) => x[0].localeCompare(y[0]) || x[1] - y[1]);
  state.cmpB = byAge.at(-1)[1];
  state.cmpA = byAge.at(-2)[1];
}
render();
</script>
</body>
